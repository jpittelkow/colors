<title>colors</title>
<script>
// Theme before the first paint, so there is no flash of the wrong one (ADR 0033). Kept per device.
(function () {
  var t = null;
  try { t = localStorage.getItem("kt-theme"); } catch (e) {}
  if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
})();
</script>
